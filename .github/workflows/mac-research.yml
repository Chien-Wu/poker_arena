name: MAC independent opponents
on:
  push:
    branches: [codex/mac-strong-bot-20261002]
    paths: [.github/workflows/mac-research.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public source without executing any bot
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git clone --depth 1 https://github.com/lucashsu007-create/fullhouse-hackathon-write-up-repo.git fetched
          git -C fetched rev-parse HEAD > snapshot/lucas.commit
          test "$(cat snapshot/lucas.commit)" = 8b98ee3efce3b224177609352258dc86db901cce
          mkdir -p snapshot/lucas
          cp fetched/LICENSE fetched/README.md snapshot/lucas/
          cp -r fetched/bots snapshot/lucas/
          cp -r 'fetched/advanced testing bots' snapshot/lucas/
          find fetched -maxdepth 2 -type f -iname '*v16*' -print > snapshot/v16_paths.txt
          curl -L --fail --max-time 30 https://callmemaybe.pages.dev -o snapshot/callmemaybe_public.html || true
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('snapshot')
          out={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(out,indent=2)+'\n')
          print('FILES',len(out))
          print('BYTES',sum(p.stat().st_size for p in root.rglob('*') if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-independent-opponents
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
