name: MAC finalist source audit
on:
  push:
    branches: [codex/mac-strong-bot-20261002]
    paths: [.github/workflows/mac-research.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download public source only, never execute bot code
        run: |
          set -euo pipefail
          mkdir -p snapshot/lucas
          git clone --depth 1 https://github.com/lucashsu007-create/fullhouse-hackathon-write-up-repo.git fetched
          git -C fetched rev-parse HEAD > snapshot/lucas.commit
          test "$(cat snapshot/lucas.commit)" = 8b98ee3efce3b224177609352258dc86db901cce
          git -C fetched ls-tree -r --name-only HEAD > snapshot/file_inventory.txt
          python3 - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('fetched');out=pathlib.Path('snapshot/lucas')
          for p in root.rglob('*'):
              rel=p.relative_to(root)
              if '.git' in rel.parts or 'engine' in rel.parts or not p.is_file():continue
              if p.suffix in ('.py','.npz','.npy') or p.name in ('README.md','LICENSE'):
                  if p.stat().st_size>20_000_000:continue
                  target=out/rel;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          PY
          curl -L --fail --max-time 30 https://callmemaybe.pages.dev/assets/index-xDlP684w.js -o snapshot/callmemaybe_public.js || true
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('snapshot')
          out={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(out,indent=2)+'\n')
          print('FILES',len(out));print('BYTES',sum(p.stat().st_size for p in root.rglob('*') if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-finalist-audit
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
