name: MAC research dependencies
on:
  push:
    branches: [codex/mac-strong-bot-20261002]
    paths: [.github/workflows/mac-research.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download evaluator sources without running package setup
        run: |
          mkdir -p snapshot/downloads
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          root=pathlib.Path('snapshot/downloads')
          for name,version,typ in [('eval7','0.1.10','sdist'),('treys','0.1.8','bdist_wheel')]:
              meta=json.load(urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json'))
              item=next(x for x in meta['urls'] if x['packagetype']==typ)
              data=urllib.request.urlopen(item['url']).read()
              assert hashlib.sha256(data).hexdigest()==item['digests']['sha256']
              (root/item['filename']).write_bytes(data)
          PY
      - name: Acquire relocatable Python 3.12 for local compatibility tests
        run: |
          python3 -m pip install uv
          uv python install 3.12
          PY=$(uv python find 3.12)
          ROOT=$(dirname $(dirname $(readlink -f "$PY")))
          tar -czf snapshot/python312.tar.gz -C "$ROOT" .
          python3 -m pip download --only-binary=:all: --python-version 3.12 --abi cp312 --platform manylinux_2_17_x86_64 --implementation cp --no-deps numpy==2.2.6 -d snapshot/downloads
      - name: Record archive provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('snapshot')
          out={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-dependencies
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
